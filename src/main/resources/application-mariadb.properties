# Se activa solo con el perfil "mariadb"
spring.datasource.url=jdbc:mariadb://localhost:3307/segundamanodb
spring.datasource.username=root
spring.datasource.password=root

# update: crea lo que falte pero NO borra al apagar (los datos sobreviven)
spring.jpa.hibernate.ddl-auto=update

# no cargar data.sql: en MariaDB empezamos con las tablas vacías
spring.sql.init.mode=never

# la consola H2 no aplica aquí
spring.h2.console.enabled=false
