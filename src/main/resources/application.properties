spring.application.name=segundaMano

spring.datasource.url=jdbc:h2:mem:segundamanodb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=clave-de-desarrollo-unisegundamano-2026-cambiar-en-produccion
# Duración del token JWT (la clave secreta está arriba, en app.jwt.secret)
app.jwt.expiracion-minutos=60

# Datos de prueba: usuarios y publicaciones (data.sql) + credenciales de acceso (data-credenciales.sql)
spring.sql.init.data-locations=classpath:data.sql,classpath:data-credenciales.sql
